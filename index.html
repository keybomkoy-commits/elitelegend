<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE LEGEND</title>
    <link rel="icon" id="siteFavicon" href="">
    
    <!-- ฟอนต์: Cinzel (หรูหราดุดัน), Chakra Petch (เท่ทันสมัย), Prompt (ไทยคลีนๆ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Cinzel:wght@700;800;900&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --red-primary: #e6001b;
            --red-Bright: #ff2a43;
            --red-dark: #550009;
            --red-glow: rgba(230, 0, 27, 0.55);
            --bg-dark: #000000;
            --card-bg: rgba(8, 8, 8, 0.88);
            --border-red: rgba(230, 0, 27, 0.3);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            box-sizing: border-box;
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Prompt', 'Chakra Petch', sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        a, button, input[type="range"], .music-header {
            cursor: pointer;
        }

        /* =========================================
           LOADING SCREEN (โลโก้ขนาดใหญ่เต็มจอ ไม่โล่ง)
        ========================================= */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, #120003 0%, #030000 55%, #000000 100%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 1.2s var(--ease-smooth), visibility 1.2s;
            will-change: opacity;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo-wrapper {
            position: relative;
            width: clamp(340px, 68vw, 760px);
            height: clamp(300px, 62vh, 640px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: clamp(15px, 2.5vh, 28px);
            transition: transform 1.2s var(--ease-smooth), filter 1.2s var(--ease-smooth), opacity 1s var(--ease-smooth);
            will-change: transform, filter, opacity;
        }

        .loader-logo-wrapper::before {
            content: '';
            position: absolute;
            width: 75%;
            height: 75%;
            background: radial-gradient(circle, rgba(230, 0, 27, 0.22) 0%, rgba(120, 0, 15, 0.08) 45%, transparent 70%);
            filter: blur(35px);
            pointer-events: none;
            z-index: 1;
        }

        #loading-screen.hidden .loader-logo-wrapper {
            transform: scale(1.06);
            filter: blur(10px);
            opacity: 0;
        }

        @keyframes loaderSubtleBreath {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 25px rgba(230, 0, 27, 0.25)); 
            }
            50% { 
                transform: scale(1.035); 
                filter: drop-shadow(0 25px 55px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 45px rgba(230, 0, 27, 0.5)); 
            }
        }

        .loader-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: loaderSubtleBreath 3.5s ease-in-out infinite;
            z-index: 2;
            -webkit-user-drag: none;
        }

        .loader-bar-box {
            width: clamp(260px, 48vw, 440px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 2;
            transition: transform 0.9s var(--ease-smooth), opacity 0.7s var(--ease-smooth);
        }

        #loading-screen.hidden .loader-bar-box {
            transform: translateY(15px);
            opacity: 0;
        }

        .loader-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            position: relative;
            overflow: visible;
        }

        .loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #550009, var(--red-primary), #ff4d60);
            box-shadow: 0 0 15px var(--red-primary);
            border-radius: 2px;
            position: relative;
            will-change: width;
        }

        .loader-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 10px #ffffff, 0 0 18px var(--red-primary);
        }

        .loader-percent {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            padding-left: 0.35em;
            color: rgba(255, 255, 255, 0.55);
            font-variant-numeric: tabular-nums;
        }

        /* =========================================
           ANNOUNCEMENT POPUP MODAL (ปรับขนาดตามรูปจริง ไม่ตัดภาพ คลีนหรู ไม่ดู AI)
        ========================================= */
        .announce-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 3vw, 28px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s var(--ease-smooth), visibility 0.4s;
        }

        .announce-backdrop.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .announce-card {
            position: relative;
            width: 100%;
            max-width: 500px;
            max-height: 92vh;
            background: #0a0a0d;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 
                0 30px 80px -10px rgba(0, 0, 0, 0.98),
                0 1px 0 0 rgba(255, 255, 255, 0.1) inset;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            transform: translateY(20px) scale(0.97);
            transition: transform 0.45s var(--ease-smooth);
        }

        /* แต่งแถบเลื่อน (Scrollbar) กรณีรูป+ข้อความยาวเกินจอ */
        .announce-card::-webkit-scrollbar { width: 4px; }
        .announce-card::-webkit-scrollbar-track { background: transparent; }
        .announce-card::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

        .announce-backdrop.active .announce-card {
            transform: translateY(0) scale(1);
        }

        /* ปุ่มกากบาทปิดมุมขวาบนแบบคลีนๆ */
        .announce-close-top {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .announce-close-top:hover {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            transform: scale(1.06);
        }

        /* กรอบรูปภาพโปรโมท: ปรับขนาดตามสัดส่วนรูปจริง ไม่ตัดภาพ (No Cropping) */
        .announce-img-wrapper {
            width: 100%;
            background: #050507;
            position: relative;
            display: none;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .announce-img-wrapper.has-img {
            display: flex;
        }

        .announce-img {
            width: 100%;
            height: auto;
            max-height: 62vh; /* ป้องกันรูปแนวตั้งยาวล้นจอ แต่ยังคงสัดส่วนเต็มใบไม่ถูกตัด */
            object-fit: contain;
            display: block;
            -webkit-user-drag: none;
        }

        /* เนื้อหาประกาศด้านล่างรูป */
        .announce-body {
            padding: 22px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            background: linear-gradient(180deg, rgba(16, 16, 20, 0.4) 0%, #0a0a0d 100%);
        }

        .announce-title {
            font-family: 'Prompt', sans-serif;
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 8px 0;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }

        .announce-desc {
            font-family: 'Prompt', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: #a1a1aa;
            line-height: 1.65;
            margin: 0 0 22px 0;
            white-space: pre-line;
            word-break: break-word;
            width: 100%;
        }

        .announce-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 2px;
        }

        .btn-announce-contact {
            flex: 2;
            text-decoration: none;
            background: var(--red-primary);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px 20px;
            color: #ffffff;
            font-family: 'Prompt', 'Chakra Petch', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-announce-contact:hover {
            background: var(--red-Bright);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(230, 0, 27, 0.35);
        }

        .btn-announce-dismiss {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #a1a1aa;
            font-family: 'Prompt', 'Chakra Petch', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-announce-dismiss:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.22);
        }

        /* =========================================
           SMOOTH ENTRANCE ANIMATIONS (เปิดตัวหน้าหลัก)
        ========================================= */
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 0; pointer-events: none;
            -webkit-user-drag: none;
            transform: scale(1.12);
            filter: contrast(1.15) brightness(0.3) blur(10px);
            transition: transform 2.4s var(--ease-smooth), filter 2.4s var(--ease-smooth);
            will-change: transform, filter;
        }

        body.page-loaded #bg-video {
            transform: scale(1);
            filter: contrast(1.15) brightness(0.75) blur(0px);
        }

        .reveal-item {
            opacity: 0;
            transform: translateY(32px) scale(0.96);
            filter: blur(8px);
            transition: 
                opacity 1.2s var(--ease-smooth), 
                transform 1.2s var(--ease-smooth), 
                filter 1.2s var(--ease-smooth);
            will-change: opacity, transform, filter;
        }

        body.page-loaded .reveal-item {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px);
        }

        .delay-1 { transition-delay: 0.15s; }
        .delay-2 { transition-delay: 0.32s; }
        .delay-3 { transition-delay: 0.48s; }
        .delay-4 { transition-delay: 0.64s; }
        .delay-5 { transition-delay: 0.80s; }

        /* =========================================
           BACKGROUND OVERLAYS
        ========================================= */
        .bg-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(10, 0, 2, 0.75) 0%, rgba(0, 0, 0, 0.96) 80%, #000000 100%);
            z-index: 1; pointer-events: none;
        }

        .bg-vignette {
            position: fixed; inset: 0;
            box-shadow: 0 0 150px #000000 inset;
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        body.page-loaded #particleCanvas {
            opacity: 1;
        }

        /* =========================================
           MAIN CONTENT & 360 LOGO ROTATION
        ========================================= */
        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: clamp(15px, 3vh, 30px); width: 100%;
            overflow-y: auto;
        }

        @keyframes logoSpin360 {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .emblem-container {
            position: relative; 
            width: clamp(180px, 28vw, 310px); 
            height: clamp(180px, 28vw, 310px);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: clamp(12px, 2.5vh, 24px); flex-shrink: 0;
            perspective: 1000px;
        }

        .main-logo {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 25px rgba(230, 0, 27, 0.45));
            z-index: 2; pointer-events: none;
            -webkit-user-drag: none;
            animation: logoSpin360 8s linear infinite;
            will-change: transform;
        }

        /* ชื่อแก๊ง / ชื่อเว็บหลัก */
        @keyframes textShine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .title-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: clamp(20px, 3.5vh, 34px);
            z-index: 4;
        }

        .asus-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(2.2rem, 5.8vw, 4.6rem);
            letter-spacing: 0.14em; 
            margin: 0; 
            font-weight: 900;
            text-transform: uppercase; 
            position: relative;
            background: linear-gradient(
                110deg, 
                #ffffff 0%, 
                #e0e0e0 25%, 
                var(--red-primary) 48%, 
                #ffffff 50%, 
                var(--red-primary) 52%, 
                #7a000d 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 20px rgba(230, 0, 27, 0.35));
            animation: textShine 5s linear infinite;
        }

        .title-divider {
            width: clamp(140px, 30vw, 260px);
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-primary), #ffffff, var(--red-primary), transparent);
            margin: 8px auto 0;
            position: relative;
            box-shadow: 0 0 12px var(--red-primary);
        }

        /* =========================================
           BUTTONS (ปุ่ม MEMBERS และ PARTNER)
        ========================================= */
        .btn-container {
            display: flex; flex-direction: column; gap: 14px; align-items: center; 
            width: 100%; max-width: 380px; z-index: 10;
        }

        @keyframes flareSweep {
            0% { left: -120%; }
            50%, 100% { left: 160%; }
        }

        .btn-members {
            width: 100%; text-decoration: none; 
            background: rgba(8, 8, 8, 0.92);
            border: 1px solid rgba(230, 0, 27, 0.45); 
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            padding: clamp(14px, 2.2vh, 18px) 28px;
            color: #ffffff; 
            font-family: 'Chakra Petch', sans-serif; 
            font-weight: 700; 
            font-size: clamp(1.05rem, 2.2vw, 1.25rem);
            text-transform: uppercase; letter-spacing: 0.3em; 
            display: flex; justify-content: center; align-items: center; gap: 14px;
            backdrop-filter: blur(12px); 
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        .btn-members::before {
            content: '';
            position: absolute;
            top: 0; left: -120%; width: 45%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(230, 0, 27, 0.35), rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            animation: flareSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
            z-index: 1;
        }

        .btn-members span {
            position: relative; z-index: 2;
            transition: transform 0.35s ease;
        }

        .btn-members .arrow-icon {
            color: var(--red-primary);
            font-size: 1.3em;
            line-height: 1;
        }

        .btn-members:hover {
            background: linear-gradient(135deg, rgba(160, 0, 18, 0.9) 0%, rgba(20, 0, 3, 0.95) 100%);
            border-color: var(--red-Bright);
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.95), 0 0 30px rgba(230, 0, 27, 0.5);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        .btn-members:hover .arrow-icon {
            color: #ffffff;
            transform: translateX(6px);
        }

        /* ส่วนของ PARTNER */
        .partner-section-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 12px; 
            width: 100%; max-width: 620px; z-index: 10; margin-top: clamp(20px, 3.5vh, 32px);
        }
        
        .partner-heading {
            font-family: 'Chakra Petch', sans-serif; 
            font-size: clamp(0.75rem, 1.2vw, 0.85rem); 
            font-weight: 600;
            letter-spacing: 0.4em; 
            color: #888888;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 12px;
        }

        .partner-heading::before,
        .partner-heading::after {
            content: '';
            width: 30px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--red-primary));
        }
        .partner-heading::after {
            background: linear-gradient(90deg, var(--red-primary), transparent);
        }
        
        .partner-buttons-group {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; width: 100%;
        }

        .partner-btn {
            text-decoration: none; 
            background: rgba(10, 10, 10, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-bottom: 2px solid var(--red-primary);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            padding: 9px 22px; 
            color: #cccccc; 
            font-family: 'Chakra Petch', sans-serif; 
            font-weight: 600; 
            font-size: clamp(0.8rem, 1.2vw, 0.92rem);
            text-transform: uppercase; 
            letter-spacing: 0.15em;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); 
            display: inline-flex; justify-content: center; align-items: center;
            white-space: nowrap; position: relative; overflow: hidden;
            min-width: 115px; 
            backdrop-filter: blur(8px);
        }

        .partner-btn:hover {
            background: rgba(130, 0, 15, 0.85); 
            border-color: var(--red-Bright); 
            color: #ffffff;
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(230, 0, 27, 0.4);
        }

        /* =========================================
           MUSIC WIDGET (เครื่องเล่นเพลงมุมขวาล่าง)
        ========================================= */
        .music-widget {
            position: fixed; bottom: clamp(14px, 2.2vh, 22px); right: clamp(14px, 2.2vw, 22px); 
            background: var(--card-bg);
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-left: 3px solid var(--red-primary);
            border-radius: 6px; 
            width: clamp(250px, 55vw, 290px); 
            z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.95);
            opacity: 0;
            transform: translateY(25px);
            transition: 
                height 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                border-color 0.45s ease,
                box-shadow 0.45s ease,
                opacity 1.1s var(--ease-smooth) 0.7s,
                transform 1.1s var(--ease-smooth) 0.7s;
        }
        body.page-loaded .music-widget {
            opacity: 1;
            transform: translateY(0);
        }
        .music-widget.collapsed { height: 58px; }
        .music-widget.expanded { 
            height: 112px; 
            border-color: rgba(230, 0, 27, 0.5); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.95), 0 0 25px rgba(230, 0, 27, 0.25); 
        }
        .music-header { display: flex; align-items: center; padding: 10px 14px; height: 58px; }
        .cover-wrapper { position: relative; width: 36px; height: 36px; margin-right: 12px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(230, 0, 27, 0.5); 
            animation: spinRecord 6s linear infinite; animation-play-state: paused;
            -webkit-user-drag: none; transition: 0.3s;
        }
        .playing .music-cover { 
            animation-play-state: running; 
            border-color: var(--red-primary); 
            box-shadow: 0 0 12px var(--red-primary); 
        }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label {

    <!-- ================= SCRIPT: หน้าโหลดสมูท 60FPS & พาร์ทิเคิล ================= -->
    <script>
        window.isLoaderFinished = false;

        (function initSmoothLoader() {
            const loaderScreen = document.getElementById('loading-screen');
            const loaderFill = document.getElementById('loaderFill');
            const loaderPercent = document.getElementById('loaderPercent');

            const duration = 2200;
            const startTime = performance.now();

            function easeOutQuart(t) {
                return 1 - Math.pow(1 - t, 4);
            }

            function updateLoader(currentTime) {
                const elapsed = currentTime - startTime;
                const rawProgress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutQuart(rawProgress);
                const currentPercent = Math.floor(easedProgress * 100);

                loaderFill.style.width = (easedProgress * 100).toFixed(2) + '%';
                loaderPercent.innerText = String(currentPercent).padStart(2, '0') + '%';

                if (rawProgress < 1) {
                    requestAnimationFrame(updateLoader);
                } else {
                    loaderFill.style.width = '100%';
                    loaderPercent.innerText = '100%';

                    setTimeout(() => {
                        loaderScreen.classList.add('hidden');
                        document.body.classList.add('page-loaded');
                        window.isLoaderFinished = true;
                        if (typeof window.tryShowAnnouncement === 'function') {
                            setTimeout(window.tryShowAnnouncement, 550);
                        }
                    }, 250);
                }
            }

            requestAnimationFrame(updateLoader);
        })();

        // --- ระบบ Particle ละอองไฟสีแดงลอยขึ้น ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initParticles(); 
        }
        window.addEventListener('resize', resizeCanvas); 

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width; 
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 2 + 0.5; 
                this.speedX = (Math.random() - 0.5) * 0.9; 
                this.speedY = -(Math.random() * 1.2 + 0.3);
                this.baseOpacity = Math.random() * 0.5 + 0.1;
                this.opacity = this.baseOpacity;
                this.pulseSpeed = Math.random() * 0.025 + 0.01;
                this.isBright = Math.random() > 0.4;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                
                this.opacity = this.baseOpacity + Math.sin(Date.now() * this.pulseSpeed) * 0.2;
                if (this.opacity < 0.05) this.opacity = 0.05;
                
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.isBright 
                    ? `rgba(230, 0, 27, ${this.opacity})` 
                    : `rgba(120, 0, 15, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 10000);
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        resizeCanvas();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <!-- ================= SCRIPT: FIREBASE, ANNOUNCEMENT & AUDIO ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSZDi7Evvb_-HhlLRSLxDsu0BvcNe0Fec",
            authDomain: "elites-d4cec.firebaseapp.com",
            projectId: "elites-d4cec",
            storageBucket: "elites-d4cec.firebasestorage.app",
            messagingSenderId: "720876752268",
            appId: "1:720876752268:web:5f42fb0005280c784fdaa9"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        // --- ระบบจัดการป๊อปอัปประกาศ (Announcement Modal Logic) ---
        const announceBackdrop = document.getElementById('announceBackdrop');
        const announceImgWrapper = document.getElementById('announceImgWrapper');
        const announceImg = document.getElementById('announceImg');
        const announceTitle = document.getElementById('announceTitle');
        const announceDesc = document.getElementById('announceDesc');
        const announceContactBtn = document.getElementById('announceContactBtn');
        const announceBtnText = document.getElementById('announceBtnText');
        const closeAnnounceTopBtn = document.getElementById('closeAnnounceTopBtn');
        const dismissAnnounceBtn = document.getElementById('dismissAnnounceBtn');

        let announceConfigData = null;
        let hasUserDismissedAnnounce = false;

        function closeAnnouncement() {
            announceBackdrop.classList.remove('active');
            hasUserDismissedAnnounce = true;
        }

        closeAnnounceTopBtn.addEventListener('click', closeAnnouncement);
        dismissAnnounceBtn.addEventListener('click', closeAnnouncement);
        announceBackdrop.addEventListener('click', (e) => {
            if (e.target === announceBackdrop) closeAnnouncement();
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAnnouncement();
        });

        window.tryShowAnnouncement = function() {
            if (!window.isLoaderFinished || !announceConfigData || hasUserDismissedAnnounce) return;
            if (announceConfigData.announceEnabled) {
                announceBackdrop.classList.add('active');
            } else {
                announceBackdrop.classList.remove('active');
            }
        };

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;

                // อัปเดตข้อมูลป๊อปอัปประกาศจากระบบ Admin
                announceConfigData = cfg;
                if (cfg.announceImgUrl && cfg.announceImgUrl.trim() !== "") {
                    announceImg.src = cfg.announceImgUrl;
                    announceImgWrapper.classList.add('has-img');
                } else {
                    announceImgWrapper.classList.remove('has-img');
                }

                const hasTitle = cfg.announceTitle && cfg.announceTitle.trim() !== "";
                announceTitle.innerText = hasTitle ? cfg.announceTitle : '';
                announceTitle.style.display = hasTitle ? 'block' : 'none';

                const hasText = cfg.announceText && cfg.announceText.trim() !== "";
                announceDesc.innerText = hasText ? cfg.announceText : '';
                announceDesc.style.display = hasText ? 'block' : 'none';

                announceBtnText.innerText = cfg.announceBtnText || 'ติดต่อเรา';

                if (cfg.announceContactUrl && cfg.announceContactUrl.trim() !== "") {
                    announceContactBtn.href = cfg.announceContactUrl;
                    announceContactBtn.style.display = 'flex';
                } else {
                    announceContactBtn.style.display = 'none';
                }

                window.tryShowAnnouncement();
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                
                const span = document.createElement('span');
                span.innerText = p.name;
                a.appendChild(span);
                
                partnerGroup.appendChild(a);
            });
        });
    </script>
